[tools]
go = "1.27"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.qc]
description = "Quality gate: --format --lint --vet --lines --secret --deps --test --vuln --e2e-gateway"
run = "bash scripts/qc.sh"

[tasks.hooks]
description = "Install lefthook pre-commit and pre-push hooks"
run = "lefthook install"

[tasks.e2e-offline]
description = "Offline integration e2e: go test -race ./internal/integration/..."
run = "go test -race ./internal/integration/..."

[tasks.e2e-gateway]
description = "Throwaway gateway e2e: --start --health --stop --smoke (pinned private ghcr image, never production)"
run = "bash scripts/e2e-gateway.sh"
