name: DCO

# Developer Certificate of Origin check (CONTRIBUTING.md; ADR-010 enables
# DCO before the first external contribution). Every commit in the PR must
# carry a "Signed-off-by:" line matching its author (git commit -s). The
# job walks the PR commit range and fails naming each commit that lacks the
# line; a PR whose commits all carry it passes. Merge commits are skipped
# (their content commits are still checked). pull_request_target is safe
# here: the job reads git metadata only and never executes PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workflow runs from the base branch (pull_request_target), so the
      # PR head is fetched explicitly from refs/pull/N/head — present in the
      # base repo for fork PRs too — alongside the base branch for the range.
      - name: Fetch PR head and base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/pull/${PR_NUMBER}/head" \
            "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"
      - name: Check Signed-off-by on every PR commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --reverse --no-merges "${BASE_SHA}..refs/pull/${PR_NUMBER}/head"); do
            author="$(git show -s --format='%an <%ae>' "${sha}")"
            subject="$(git show -s --format='%s' "${sha}")"
            body="$(git show -s --format='%B' "${sha}")"
            if grep -qFx "Signed-off-by: ${author}" <<<"${body}"; then
              echo "ok   ${sha:0:7} ${subject}"
            else
              echo "::error::${sha:0:7} ${subject} — missing \"Signed-off-by: ${author}\" (re-commit with: git commit -s)"
              fail=1
            fi
          done
          exit "${fail}"
