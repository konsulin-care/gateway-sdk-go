name: PR Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Quality gate
        run: mise run qc --format --lint --vet --lines --secret --deps --test --vuln

  e2e-offline:
    name: e2e-offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Offline end-to-end
        run: mise run e2e-offline

  e2e-gateway:
    name: e2e-gateway
    # Same-repo PRs only: the gateway image is private and fork PRs get no
    # secrets. Fork PRs rely on quality + e2e-offline (required); a skipped
    # e2e-gateway counts as passing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-gateway.yml
    with:
      # Track the latest gateway release per SDK policy (the gateway publishes
      # :latest only on semver releases, so it is not a per-push moving target).
      image: ghcr.io/konsulin-care/konsulin-gateway:latest

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          # Inline PR review comments on PRs; plain pass/fail elsewhere
          # (push, dispatch) where there is no PR to comment on.
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'local' }}
          # The local reporter plus file filtering needs a -diff command
          # (reviewdog errors with "diff command is empty"); off-PR there is
          # no PR base to diff against, so skip filtering there.
          filter_mode: ${{ github.event_name == 'pull_request' && 'file' || 'nofilter' }}
