name: E2E Gateway

# Reusable gateway e2e: callers pass the image via the workflow_call input.
# No secrets declaration here — GITHUB_TOKEN is granted to called workflows
# automatically; callers must not pass inherited secrets.
on:
  workflow_call:
    inputs:
      image:
        description: Gateway container image to exercise
        type: string
        default: ghcr.io/konsulin-care/konsulin-gateway:latest

permissions:
  contents: read

jobs:
  e2e-gateway:
    name: e2e-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # The gateway ghcr package already grants this repo Read via Manage
      # Actions access, so GITHUB_TOKEN with packages: read is enough —
      # no PAT or org secret needed.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Conformance mode: the harness starts the throwaway gateway in
      # development mode (no admin TOTP secret, raised rate limits) and runs
      # go run ./cmd/conformance against it; the container is removed even
      # on failure. The image is passed via env only, never interpolated
      # into run:.
      - name: Run conformance against the throwaway gateway
        env:
          GATEWAY_IMAGE: ${{ inputs.image }}
        run: mise run e2e-gateway --conformance
